version: "3.9"

services:
  backend:
    build: ./backend
    container_name: vitalcore-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - vitalcore_data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo_mode}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123}
      - ADMIN_EMAIL=sposada2026@udec.cl
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vitalcore-web
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-supersecretkey123}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-demo}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-demo}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vitalcore_data:
