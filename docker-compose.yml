services:
  backend:
    build: ./backend
    container_name: vitalcore-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - vitalcore_data:/app/data
    environment:
      - APP_ENV=development
      - DEMO_MODE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo_mode}
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vitalcore-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vitalcore_data:
